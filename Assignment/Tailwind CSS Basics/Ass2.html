<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric box</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
</head>
<body>
    <div class="bg-blue-350 shadow w-200  h-40 m-8 ">
        <div class="inline-flex gap-15 m-5">
            <div>
                <h6 class="text-sm w-20">Active Users</h6>
                <p class="text-sm font-bold">12,480</p>
                <span class="center w-6 h-4 rounded-md bg-green-400 text-sm bold">Up</span>
            </div>
            <div>
                <h6 class="text-sm">Request/Min</h6>
                <p class="text-sm font-bold">1,240</p>
                <span class="center w-8 h-4 rounded-md bg-blue-400 text-sm bold">stable</span>
            </div>
            <div>
                <h6 class="text-sm w-20">Error rate</h6>
                <p class="text-sm font-bold">2.1%</p>
                <span class="center w-7 h-4 rounded-md bg-red-400 text-sm bold">Down</span>
            </div>
            <span class="inline-flex bg-blue-300 text-black-800 rounded-md ml-50 font-bold h-13 px-6">Download Report</span>
         </div>
            <div class="rounded w-185 h-10 bg-red-200 border-l-4 border-red-400 p-2 ml-7">
                <p>Scheduled maintained tonight may briefly affect dashboard updates </p>
            </div>
        </div>
    </div>
</body>
</html>
